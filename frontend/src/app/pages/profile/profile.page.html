<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil de Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div style="max-width: 400px; margin: 40px auto;">
    <ion-avatar style="width: 130px; height: 130px; margin: 0 auto 20px auto; border: 3px solid var(--ion-color-primary); display: flex; align-items: center; justify-content: center; background: #222;">
      <!-- Si hay foto tomada, muestra la imagen; si no, muestra el icono vectorial -->
      <img *ngIf="profileImage" [src]="profileImage" alt="Avatar de Perfil" style="width: 100%; height: 100%; object-fit: cover;" />
      <ion-icon *ngIf="!profileImage" name="person-circle-outline" style="font-size: 110px; color: var(--ion-color-primary);"></ion-icon>
    </ion-avatar>

    <h2 style="font-weight: bold;">{{ userProfile.username }}</h2>
    <p style="color: gray; margin-bottom: 30px;">{{ userProfile.email }}</p>

    <ion-button expand="block" color="primary" (click)="takePhoto()">
      <ion-icon name="camera-outline" slot="start"></ion-icon>
      Tomar Foto o Seleccionar de Galería
    </ion-button>

    <ion-button expand="block" color="danger" fill="outline" (click)="logout()" style="margin-top: 20px;">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
