<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 400px; margin: 40px auto;">
    <ion-item>
      <ion-input label="Nombre de Usuario" labelPlacement="stacked" [(ngModel)]="user.username" placeholder="Tu nombre"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-top">
      <ion-input label="Correo Electrónico" labelPlacement="stacked" type="email" [(ngModel)]="user.email" placeholder="correo@domain.com"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-top">
      <ion-input label="Contraseña" labelPlacement="stacked" type="password" [(ngModel)]="user.password" placeholder="Tu contraseña"></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="onRegister()">
      Registrarse
    </ion-button>

    <ion-button expand="block" fill="clear" routerLink="/login" class="ion-margin-top">
      ¿Ya tienes cuenta? Inicia sesión
    </ion-button>
  </div>
</ion-content>
